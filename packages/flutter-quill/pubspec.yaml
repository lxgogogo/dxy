name: flutter_quill
description: "A rich text editor built for Android, iOS, Web, and desktop platforms. It's the WYSIWYG editor and a Quill component for Flutter."
version: 11.0.0-dev.14
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Dart Packages
  http: ^1.0.0
  path: ^1.8.0
  universal_html: ^2.2.4
  cross_file: ^0.3.3+4
  photo_view: ^0.15.0

  dart_quill_delta: ^10.0.0
  collection: ^1.17.0
  quiver: ^3.2.0
  meta: ^1.7.0
  html: ^0.15.0
  intl: ^0.19.0

  flutter_colorpicker: ^1.1.0

  # For converting HTML to Quill delta
  flutter_quill_delta_from_html: ^1.4.1
  markdown: ^7.1.0
  charcode: ^1.3.0

  # Plugins
  url_launcher: ^6.2.1
  flutter_keyboard_visibility_temp_fork: ^0.1.1
  quill_native_bridge: ^10.7.11
  video_player: ^2.8.0
  gal: ^2.3.0
  gal_linux: ^0.1.0
  image_picker: ^1.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_quill_test: ^11.0.0-dev.1
  test: ^1.24.3

  # For scripts only
  yaml_edit: ^2.2.1
  yaml: ^3.1.2
  http: ^1.2.1

  path: any
flutter:
  uses-material-design: true
  generate: true
