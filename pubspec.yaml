  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^2.0.0

dependency_overrides:
  chewie:
    path: ./packages/chewie

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon/ios_icon.png"
  adaptive_icon_background: "assets/app_icon/android_icon_bg.png"
  adaptive_icon_foreground: "assets/app_icon/android_icon_fg.png"
  image_path_ios: "assets/app_icon/ios_icon.png"
  min_sdk_android: 21

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/equity_center/
    - assets/svg/
    - assets/lottie/
    - assets/sounds/
    - assets/courses/