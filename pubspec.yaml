name: holdem
description: A new Flutter project.
publish_to: none

version: 1.2.1+94

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  # 富文本
  flutter_quill:
    path: ./packages/flutter-quill
  flutter_quill_delta_from_html: ^1.4.2
  vsc_quill_delta_to_html:
    path: ./plugins/vsc_quill_delta_to_html
  flutter_widget_from_html: ^0.15.3
  pull_to_refresh: ^2.0.0
  flutter_easyloading: ^3.0.5
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  image_gallery_saver: ^2.0.3
  video_player: ^2.8.6
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  dio: ^5.4.3+1
  dynamic_tabbar: ^1.0.6
  group_button: ^5.3.4
  card_swiper: ^3.0.1
  get: ^4.6.6
  fluttertoast: ^8.2.5
  file_picker: ^8.0.3
  flutter_reorderable_grid_view: ^4.0.0
  reorderable_grid_view: ^2.2.6
  detectable_text_field: ^3.0.2
  common_utils: ^2.1.0
  event_bus: ^2.0.0
  intl: ^0.19.0
  dropdown_button2: ^2.3.8
  photo_view: ^0.15.0
  package_info_plus: ^8.0.0
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.2.6
  oktoast: ^3.4.0
  share_plus: ^10.1.2
  universal_html: ^2.2.4
  http: any
  chewie: ^1.8.1
  # get_thumbnail_video: ^0.6.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3
  sticky_headers: ^0.3.0+2
  flutter_svg: ^2.0.10+1
  super_tooltip: ^2.0.9
  flutter_slidable: ^3.1.2
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^6.1.0
  device_info_plus: ^10.1.2
  flutter_secure_storage: ^9.2.2
  logger: ^2.5.0
  html: ^0.15.4
  hive: ^2.2.3
  scroll_to_index: ^3.0.1
  lottie: ^3.2.0
  flutter_inappwebview: 6.1.5
  app_links: ^6.3.3

dev_dependencies:
  build_runner: ^2.4.9
  flutter_gen_runner: ^5.4.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^2.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon/ios_icon.png"
  adaptive_icon_background: "assets/app_icon/android_icon_bg.png"
  adaptive_icon_foreground: "assets/app_icon/android_icon_fg.png"
  image_path_ios: "assets/app_icon/ios_icon.png"
  min_sdk_android: 21

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/lottie/